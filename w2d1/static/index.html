<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Петрович — агент на Cerebras</title>
<link rel="stylesheet" href="/static/colors_and_type.css">
<style>
  /* Bro Agent: тот же Calm Intelligence, акцент — Soft Violet на элементах ИИ.
     Sage остаётся нейтральным активным состоянием, бордеры вместо теней. */
  :root { --accent: var(--violet); --accent-soft: #F2EEFC; --accent-line: #E6E1FB; }

  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  button, input, select, textarea { font-family: var(--font-sans); }

  /* ---------- Шапка ---------- */
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-6);
    padding: var(--space-4) var(--space-6);
    border-bottom: var(--hairline); background: var(--surface);
  }
  .brand { display: flex; align-items: center; gap: var(--space-3); }
  .brand .av { width: 36px; height: 36px; border-radius: 12px; background: var(--accent);
    color: var(--fg-on-brand); display: flex; align-items: center; justify-content: center; }
  .brand .n { font: 650 18px/22px var(--font-sans); letter-spacing: -0.02em; color: var(--fg-strong); }
  .brand .s { font: 400 12px/16px var(--font-sans); color: var(--fg-subtle); }
  .provider { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .provider .k { font: var(--fw-medium) var(--t-caption-size)/var(--t-caption-lh) var(--font-sans);
    letter-spacing: var(--t-caption-tr); text-transform: uppercase; color: var(--fg-subtle); }
  .provider .logo { color: var(--fg-muted); display: flex; }
  .provider .logo svg { height: 22px; width: auto; display: block; }

  /* ---------- Раскладка ---------- */
  .main { flex: 1; display: grid; grid-template-columns: 1fr 320px;
    grid-template-rows: minmax(0, 1fr); min-height: 0; }
  .chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .msgs { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-6); display: flex;
    flex-direction: column; gap: var(--space-4); }
  .msgs-inner { max-width: 720px; width: 100%; margin: 0 auto; display: flex;
    flex-direction: column; gap: var(--space-4); }

  /* ---------- Сообщения ---------- */
  .turn { display: flex; gap: var(--space-3); }
  .turn.me { justify-content: flex-end; }
  .turn .av { flex: none; width: 32px; height: 32px; border-radius: var(--r-sm);
    background: var(--accent); color: var(--fg-on-brand);
    display: flex; align-items: center; justify-content: center; }
  .body { min-width: 0; max-width: 82%; display: flex; flex-direction: column; gap: var(--space-2); }
  .msg { padding: 12px 14px; font: 400 15px/23px var(--font-sans); overflow-wrap: anywhere; }
  /* Ответ бота — размеченный markdown; свои сообщения и ошибки остаются текстом. */
  .msg.s-me, .msg.err { white-space: pre-wrap; }
  .msg.s-bot { background: var(--surface); border: var(--hairline);
    border-radius: 18px 18px 18px 4px; color: var(--fg); }
  .msg.s-me { background: var(--accent); color: var(--fg-on-brand);
    border-radius: 18px 18px 4px 18px; }
  .msg.err { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .msg code, .msg pre { font-family: var(--font-mono); font-size: 0.9em; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md ul, .md ol { margin: 8px 0; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md h4 { margin: 12px 0 6px; font: 600 15px/22px var(--font-sans); color: var(--fg-strong); }
  .md strong { font-weight: 600; }
  .md hr { border: 0; border-top: var(--hairline); margin: 12px 0; }
  .md code { background: var(--surface-alt); padding: 1px 4px; border-radius: 4px; }
  .md pre { margin: 8px 0; padding: 10px 12px; background: var(--surface-alt);
    border: var(--hairline); border-radius: var(--r-sm);
    white-space: pre; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }

  .reasoning { border: var(--hairline); border-radius: var(--r-sm); background: var(--surface-alt); }
  .reasoning > summary { list-style: none; cursor: pointer; padding: 8px 12px;
    font: 500 12px/16px var(--font-sans); color: var(--fg-subtle); }
  .reasoning > summary::-webkit-details-marker { display: none; }
  .reasoning > summary::before { content: "›"; display: inline-block; width: 12px;
    transition: transform var(--dur-2) var(--ease-standard); }
  .reasoning[open] > summary::before { transform: rotate(90deg); }
  .reasoning .r-text { padding: 0 12px 10px; font: 400 13px/20px var(--font-sans);
    color: var(--fg-subtle); white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 260px; overflow-y: auto; }

  .meta { font: 400 12px/16px var(--font-sans); color: var(--fg-subtle);
    font-variant-numeric: tabular-nums; }

  .caret { display: none; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px;
    background: var(--accent); animation: blink 1s steps(1) infinite; }
  .streaming .caret { display: inline-block; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }

  .empty { margin: auto; text-align: center; color: var(--fg-subtle);
    font: 400 15px/23px var(--font-sans); max-width: 380px; }

  /* ---------- Композер ---------- */
  .composer-wrap { border-top: var(--hairline); background: var(--surface); padding: var(--space-4) var(--space-6); }
  .composer { max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: var(--space-2);
    background: var(--bg); border: var(--hairline); border-radius: var(--r-lg); padding: 6px 6px 6px 16px; }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent;
    font: 400 15px/23px var(--font-sans); color: var(--fg); padding: 10px 0; max-height: 180px; }
  .composer textarea::placeholder { color: var(--fg-disabled); }
  .send { flex: none; width: 40px; height: 40px; border: 0; border-radius: var(--r-full);
    background: var(--accent); color: var(--fg-on-brand); display: flex; align-items: center;
    justify-content: center; cursor: pointer; transition: background var(--dur-2) var(--ease-standard); }
  .send:disabled { background: var(--fg-disabled); cursor: default; }
  .hint { max-width: 720px; margin: var(--space-2) auto 0; font: 400 12px/16px var(--font-sans);
    color: var(--fg-subtle); }

  /* ---------- Панель ---------- */
  .panel { border-left: var(--hairline); background: var(--surface); overflow-y: auto;
    padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; }
  .panel-head h2 { font: 650 18px/24px var(--font-sans); letter-spacing: -0.02em; }
  .saved { font: 500 12px/16px var(--font-sans); color: var(--success); opacity: 0;
    transition: opacity var(--dur-2) var(--ease-standard); }
  .saved.on { opacity: 1; }
  .saved.bad { color: var(--danger); }

  .field { display: flex; flex-direction: column; gap: var(--space-2); }
  .field > label { font: var(--fw-medium) var(--t-caption-size)/var(--t-caption-lh) var(--font-sans);
    letter-spacing: var(--t-caption-tr); text-transform: uppercase; color: var(--fg-subtle); }
  .field .note { font: 400 12px/16px var(--font-sans); color: var(--fg-subtle); }
  select, .panel textarea {
    width: 100%; border: var(--hairline); border-radius: var(--r-sm); background: var(--bg);
    color: var(--fg); font: 400 14px/20px var(--font-sans); padding: 9px 11px; outline: 0;
  }
  select:focus, .panel textarea:focus { border-color: var(--accent); }
  .panel textarea { resize: vertical; min-height: 108px; }

  .row { display: flex; align-items: center; gap: var(--space-3); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .value { font: 600 14px/20px var(--font-sans); color: var(--fg-strong);
    font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }

  .btn { border: var(--hairline); border-radius: var(--r-sm); background: var(--bg);
    color: var(--fg-strong); font: 500 13px/18px var(--font-sans); padding: 9px 12px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background var(--dur-2) var(--ease-standard); }
  .btn:hover { background: var(--surface-mist); }
  .btn.wide { width: 100%; }

  .session { border: var(--hairline); border-radius: var(--r-md); background: var(--bg); }
  .session .r { display: flex; justify-content: space-between; gap: var(--space-3);
    padding: 10px 12px; border-bottom: var(--hairline);
    font: 400 13px/18px var(--font-sans); color: var(--fg-muted); }
  .session .r:last-child { border-bottom: 0; }
  .session .r b { font-weight: 600; color: var(--fg-strong); font-variant-numeric: tabular-nums; }

  @media (max-width: 900px) {
    body { height: auto; overflow: auto; }
    .main { grid-template-columns: 1fr; grid-template-rows: auto; }
    .panel { border-left: 0; border-top: var(--hairline); }
    .msgs { max-height: none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="av">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>
      </svg>
    </div>
    <div>
      <div class="n">Петрович</div>
      <div class="s">ворчливый автомеханик на Cerebras</div>
    </div>
  </div>
  <div class="provider">
    <div class="k">Провайдер</div>
    <div class="logo" id="logo"></div>
  </div>
</header>

<div class="main">
  <section class="chat">
    <div class="msgs" id="msgs"><div class="msgs-inner" id="inner"></div></div>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Опиши, что с машиной"></textarea>
        <button class="send" id="send" title="Отправить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>
          </svg>
        </button>
      </div>
      <div class="hint">Enter — отправить, Shift+Enter — перенос строки</div>
    </div>
  </section>

  <aside class="panel">
    <div class="panel-head">
      <h2>Агент</h2>
      <span class="saved" id="saved">сохранено</span>
    </div>

    <div class="field">
      <label for="model">Модель</label>
      <select id="model"></select>
      <div class="note" id="model-note"></div>
    </div>

    <div class="field">
      <label for="temp">Температура</label>
      <div class="row">
        <input type="range" id="temp" min="0" max="2" step="0.1">
        <span class="value" id="temp-v">0.7</span>
      </div>
      <div class="note">0 — предсказуемо, 2 — свободно</div>
    </div>

    <div class="field">
      <label for="effort">Рассуждение</label>
      <select id="effort">
        <option value="none">выключено</option>
        <option value="low">низкое</option>
        <option value="medium">среднее</option>
        <option value="high">высокое</option>
      </select>
      <div class="note">Рассуждение считается как токены ответа и оплачивается по цене выхода</div>
    </div>

    <div class="field">
      <label for="prompt">Системный промпт</label>
      <textarea id="prompt"></textarea>
      <button class="btn wide" id="reset-prompt">Вернуть базовый</button>
    </div>

    <button class="btn wide" id="reset">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
      </svg>
      Очистить контекст
    </button>

    <div class="field">
      <label>Сессия</label>
      <div class="session">
        <div class="r"><span>Сообщений</span><b id="s-msgs">0</b></div>
        <div class="r"><span>Токены на входе</span><b id="s-in">0</b></div>
        <div class="r"><span>Токены на выходе</span><b id="s-out">0</b></div>
        <div class="r"><span>Стоимость</span><b id="s-cost">—</b></div>
      </div>
    </div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const inner = $('inner'), msgs = $('msgs'), input = $('input'), send = $('send');

let models = [];
let defaultPrompt = '';
let busy = false;
const session = { messages: 0, prompt: 0, completion: 0, cost: 0, priced: false };

const BOT_GLYPH = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/>
  <path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>`;

// Логотип вставляется инлайном, а не через <img>: слово «cerebras» в марке
// нарисовано currentColor и должно брать цвет из токенов страницы.
fetch('/static/cerebras.svg').then(r => r.text()).then(t => { $('logo').innerHTML = t; });

/* ---------- Markdown ---------- */
// Модель отвечает markdown-ом. Разметку разбираем сами: текст сначала полностью
// экранируется, дальше по нему ходит парсер — в DOM не попадает ни один символ
// разметки от модели, только теги, которые собрали здесь.

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Инлайн-разметка внутри уже экранированной строки. Код прячем в плейсхолдеры,
// чтобы ** и _ внутри `кода` остались символами.
function inlineMd(s) {
  const code = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => `\u0000${code.push(c) - 1}\u0000`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^\s*][^*\n]*?[^\s*]|[^\s*])\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^\w_])_([^_\n]+)_(?![\w_])/g, '$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${code[i]}</code>`);
}

function renderMarkdown(text) {
  const lines = escapeHtml(String(text == null ? '' : text)).replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let para = [];
  let list = null; // { tag, items }

  const flushPara = () => {
    if (para.length) out.push(`<p>${inlineMd(para.join('<br>'))}</p>`);
    para = [];
  };
  const flushList = () => {
    if (list) out.push(`<${list.tag}>` + list.items.map(i => `<li>${inlineMd(i)}</li>`).join('') + `</${list.tag}>`);
    list = null;
  };
  const flush = () => { flushPara(); flushList(); };
  const item = (tag, body) => {
    flushPara();
    if (list && list.tag !== tag) flushList();
    if (!list) list = { tag, items: [] };
    list.items.push(body);
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flush();
      const buf = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) buf.push(lines[i]);
      out.push(`<pre><code>${buf.join('\n')}</code></pre>`);
      continue;
    }
    if (!line.trim()) { flush(); continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flush(); out.push('<hr>'); continue; }

    const head = line.match(/^\s*#{1,3}\s+(.+?)\s*#*$/);
    if (head) { flush(); out.push(`<h4>${inlineMd(head[1])}</h4>`); continue; }

    const bullet = line.match(/^\s*[-*•]\s+(.+)$/);
    if (bullet) { item('ul', bullet[1]); continue; }

    const numbered = line.match(/^\s*\d+[.)]\s+(.+)$/);
    if (numbered) { item('ol', numbered[1]); continue; }

    flushList();
    para.push(line.trim());
  }
  flush();
  return out.join('');
}

/* ---------- Отрисовка ---------- */

function showEmpty() {
  inner.innerHTML = '<div class="empty">Агент помнит разговор целиком. Панель справа меняет модель, ' +
    'температуру, глубину рассуждения и системный промпт — контекст при этом сохраняется.</div>';
}

function userTurn(text) {
  const turn = document.createElement('div');
  turn.className = 'turn me';
  const body = document.createElement('div');
  body.className = 'body';
  const msg = document.createElement('div');
  msg.className = 'msg s-me';
  msg.textContent = text;
  body.append(msg);
  turn.append(body);
  return turn;
}

function botTurn() {
  const turn = document.createElement('div');
  turn.className = 'turn';
  const av = document.createElement('div');
  av.className = 'av';
  av.innerHTML = BOT_GLYPH;
  const body = document.createElement('div');
  body.className = 'body';
  const msg = document.createElement('div');
  msg.className = 'msg s-bot';
  const text = document.createElement('span');
  text.className = 'md';
  const caret = document.createElement('span');
  caret.className = 'caret';
  msg.append(text, caret);
  body.append(msg);
  turn.append(av, body);
  return { turn, body, msg, text, caret };
}

// Ответ перерисовывается целиком на каждый delta: тексты короткие, а частичный
// markdown иначе не собрать. Курсор переносим внутрь последнего блока, чтобы он
// мигал в конце строки, а не под ней.
function paintBot(bot, text) {
  bot.text.innerHTML = renderMarkdown(text);
  const last = bot.text.lastElementChild;
  if (last && last.tagName !== 'PRE' && last.tagName !== 'HR') last.append(bot.caret);
  else bot.msg.append(bot.caret);
}

function addReasoning(body, msg) {
  const details = document.createElement('details');
  details.className = 'reasoning';
  details.open = true; // пока стримится — видно; после ответа свернём
  const summary = document.createElement('summary');
  summary.textContent = 'Рассуждение';
  const text = document.createElement('div');
  text.className = 'r-text';
  details.append(summary, text);
  body.insertBefore(details, msg);
  return { details, summary, text };
}

function atBottom() { return msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 80; }
function scroll() { msgs.scrollTop = msgs.scrollHeight; }

/* ---------- Метрики ---------- */

const num = (v, digits = 0) => v.toLocaleString('ru-RU', { maximumFractionDigits: digits });

function metricsLine(m) {
  const parts = [];
  parts.push(m.ttft_ms === null ? 'TTFT —' : `TTFT ${num(m.ttft_ms)} мс`);
  parts.push(`${(m.total_ms / 1000).toFixed(1)} с`);
  const reasoning = m.reasoning_tokens > 0 ? ` (+${num(m.reasoning_tokens)} рассужд.)` : '';
  parts.push(`${num(m.prompt_tokens)} → ${num(m.completion_tokens)} ток.${reasoning}`);
  parts.push(m.server_tok_s === null ? '— ток/с сервер' : `${num(m.server_tok_s)} ток/с сервер`);
  parts.push(m.client_tok_s === null ? '— ток/с клиент' : `${num(m.client_tok_s)} ток/с клиент`);
  parts.push(m.cost_usd === null ? '—' : '$' + m.cost_usd.toFixed(4));
  if (m.finish_reason && m.finish_reason !== 'stop') parts.push('обрыв: ' + m.finish_reason);
  return parts.join(' · ');
}

function countSession(m) {
  session.prompt += m.prompt_tokens;
  session.completion += m.completion_tokens;
  if (m.cost_usd !== null) { session.cost += m.cost_usd; session.priced = true; }
  renderSession();
}

function renderSession() {
  $('s-msgs').textContent = num(session.messages);
  $('s-in').textContent = num(session.prompt);
  $('s-out').textContent = num(session.completion);
  $('s-cost').textContent = session.priced ? '$' + session.cost.toFixed(4) : '—';
}

/* ---------- Панель ---------- */

let saveTimer = null;

function currentSettings() {
  return {
    model: $('model').value,
    temperature: parseFloat($('temp').value),
    reasoning_effort: $('effort').value,
    system_prompt: $('prompt').value,
  };
}

async function saveSettings() {
  const flag = $('saved');
  try {
    const res = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(currentSettings()),
    });
    const text = await res.text();
    flag.textContent = res.ok ? 'сохранено' : text;
    flag.classList.toggle('bad', !res.ok);
  } catch (e) {
    flag.textContent = 'не сохранено';
    flag.classList.add('bad');
  }
  flag.classList.add('on');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => flag.classList.remove('on'), 1600);
}

let debounceTimer = null;
function saveSoon(delay) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(saveSettings, delay);
}

function renderModelNote() {
  const model = models.find(m => m.id === $('model').value);
  if (!model) return;
  const speed = model.tok_s_hint ? `~${num(model.tok_s_hint)} ток/с` : 'скорость не заявлена';
  const price = model.price_in === null || model.price_out === null
    ? 'цена —'
    : `$${model.price_in} / $${model.price_out} за 1M ток.`;
  $('model-note').textContent = `${speed} · ${price}`;
}

/* ---------- Диалог ---------- */

async function ask() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true;
  send.disabled = true;
  input.value = '';
  input.style.height = 'auto';

  if (session.messages === 0) inner.innerHTML = '';
  inner.append(userTurn(text));
  session.messages += 1;
  renderSession();

  const bot = botTurn();
  bot.msg.classList.add('streaming');
  inner.append(bot.turn);
  scroll();

  let reasoning = null;
  let answer = '';

  const finish = () => {
    bot.msg.classList.remove('streaming');
    busy = false;
    send.disabled = false;
    input.focus();
  };

  const fail = (message) => {
    bot.msg.classList.add('err');
    if (!answer) bot.text.textContent = message;
    if (reasoning) reasoning.details.open = false;
    finish();
    scroll();
  };

  const handle = (name, data) => {
    const stick = atBottom();
    if (name === 'reasoning') {
      if (!reasoning) reasoning = addReasoning(bot.body, bot.msg);
      reasoning.text.textContent += data;
      reasoning.text.scrollTop = reasoning.text.scrollHeight;
    } else if (name === 'content') {
      answer += data;
      paintBot(bot, answer);
    } else if (name === 'done') {
      paintBot(bot, answer);
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = metricsLine(data);
      bot.body.append(meta);
      if (reasoning) {
        reasoning.summary.textContent = `Рассуждение · ${num(data.reasoning_tokens)} токенов`;
        reasoning.details.open = false;
      }
      session.messages += 1;
      countSession(data);
      finish();
    } else if (name === 'error') {
      // Вопрос без ответа агент из истории убрал — снимаем и со счётчика.
      session.messages -= 1;
      renderSession();
      fail(data);
    }
    if (stick) scroll();
  };

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) { fail(`сервер ответил ${res.status}`); return; }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, cut);
        buf = buf.slice(cut + 2);
        let name = 'message', payload = null;
        for (const line of block.split('\n')) {
          if (line.startsWith('event:')) name = line.slice(6).trim();
          else if (line.startsWith('data:')) payload = line.slice(5).trim();
        }
        if (payload !== null) handle(name, JSON.parse(payload));
      }
    }
  } catch (e) {
    fail('соединение с сервером прервалось: ' + e.message);
    return;
  }
  if (busy) fail('поток оборвался без ответа');
}

/* ---------- Запуск ---------- */

async function boot() {
  const state = await (await fetch('/api/state')).json();
  models = state.models;
  defaultPrompt = state.default_system_prompt;

  $('model').innerHTML = models
    .map(m => `<option value="${m.id}">${m.label}</option>`)
    .join('');
  $('model').value = state.settings.model;
  $('temp').value = state.settings.temperature;
  $('temp-v').textContent = Number(state.settings.temperature).toFixed(1);
  $('effort').value = state.settings.reasoning_effort;
  $('prompt').value = state.settings.system_prompt;
  renderModelNote();

  session.messages = state.history.length;
  renderSession();
  if (state.history.length === 0) {
    showEmpty();
  } else {
    for (const m of state.history) {
      if (m.role === 'user') {
        inner.append(userTurn(m.content));
      } else {
        const bot = botTurn();
        paintBot(bot, m.content);
        inner.append(bot.turn);
      }
    }
    scroll();
  }
}

$('model').addEventListener('change', () => { renderModelNote(); saveSettings(); });
$('effort').addEventListener('change', saveSettings);
$('temp').addEventListener('input', () => {
  $('temp-v').textContent = Number($('temp').value).toFixed(1);
  saveSoon(400);
});
$('prompt').addEventListener('input', () => saveSoon(400));
$('reset-prompt').addEventListener('click', () => { $('prompt').value = defaultPrompt; saveSettings(); });

$('reset').addEventListener('click', async () => {
  await fetch('/api/reset', { method: 'POST' });
  session.messages = 0; session.prompt = 0; session.completion = 0;
  session.cost = 0; session.priced = false;
  renderSession();
  showEmpty();
});

send.addEventListener('click', ask);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});

boot().catch(e => { showEmpty(); $('inner').textContent = 'Не удалось получить состояние агента: ' + e.message; });
</script>
